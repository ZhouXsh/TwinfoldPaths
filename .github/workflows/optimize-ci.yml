name: Optimize CI

on:
  push:
    branches:
      - optimize/ui-level-variety-20260827
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:levels
      - run: npm run solve:levels
      - run: npm run report:solution-variety
      - run: npm run build
      - run: npm run verify:dist
      - name: Upload solution variety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solution-variety-report
          path: reports/solution-variety-report.json
          if-no-files-found: ignore
