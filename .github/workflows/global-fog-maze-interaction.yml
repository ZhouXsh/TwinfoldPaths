name: Global Fog Maze Interaction

on:
  push:
    branches:
      - optimize/global-fog-maze-interaction-20260827

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build solver tools
        run: npm run build:tools
      - name: Apply global fog, maze branches and cross-ball interaction
        run: node tools/maze-interaction-upgrade.mjs
      - name: Recompute authoritative parMoves
        run: node tools/sync-par.mjs
      - name: Format generated content
        run: npx prettier --write levels reports/global-fog-maze-interaction-summary.md reports/global-fog-maze-interaction-summary.json tests/unit/content/levels.test.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:levels
      - run: npm run solve:levels
      - run: npm run report:solution-variety
      - run: npm run build
      - run: npm run verify:dist
      - name: Install Chromium for UI regression
        run: npx playwright install --with-deps chromium
      - name: Run Chromium E2E
        run: npx playwright test --project=chromium --project=mobile-320 --workers=4
      - name: Commit generated level content and factual report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add levels reports/global-fog-maze-interaction-summary.md reports/global-fog-maze-interaction-summary.json tests/unit/content/levels.test.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "content: make fog global and convert late game into shared mazes"
            git push
          fi
